<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسنپ مشترک — همسفریاب دانشجویی کیش</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#dfe3ea;--pri:#1f6feb;--pt:#e6f0ff;--ok:#1a7f4b;--okt:#e3f6ec;--wr:#b54708;--wt:#fff1e0;--er:#b42318;--et:#fdeceb}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14171d;--card:#1d222b;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#2d3441;--pri:#6ea8ff;--pt:#1c2b45;--ok:#5fd093;--okt:#163226;--wr:#f5b66d;--wt:#3a2a14;--er:#ff8f86;--et:#3b1b19}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}nav a{padding:6px 12px;border-radius:8px;color:var(--mut);text-decoration:none;font-size:14px}nav a.on{background:var(--pt);color:var(--pri);font-weight:600}
main{max-width:900px;margin:0 auto;padding:18px 14px 40px}h2{margin:4px 0 14px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px}.row>*{flex:1 1 150px}
label{display:block;font-size:13px;color:var(--mut)}input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
button{padding:7px 14px;border:0;border-radius:8px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600}
button.s{background:var(--pt);color:var(--pri)}button.d{background:var(--et);color:var(--er)}button:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;background:var(--pt);color:var(--pri);margin-inline-end:6px}.tag.ok{background:var(--okt);color:var(--ok)}.tag.er{background:var(--et);color:var(--er)}.tag.w{background:var(--wt);color:var(--wr)}
.trip{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}.mut{color:var(--mut);font-size:13px}
.msg{padding:10px 14px;border-radius:10px;margin-bottom:12px;background:var(--et);color:var(--er)}
.ct{background:var(--okt);color:var(--ok);border-radius:8px;padding:6px 10px;margin-top:8px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right}.sc{overflow-x:auto}
</style></head><body>
<header><b>🚕 اسنپ مشترک</b><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=s=>new Date(s.replace(' ','T')).toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'}),fa=n=>Number(n).toLocaleString('fa-IR');
const GL={all:'مختلط',f:'فقط خانم‌ها',m:'فقط آقایان'},TG={good:'خوش‌قول',late:'دیر آمد',rude:'بدرفتار',noshow:'نیامد'};
async function api(a,d){const r=await fetch('api.php?a='+a,{method:d?'POST':'GET',headers:d?{'Content-Type':'application/json'}:{},body:d?JSON.stringify(d):undefined});let j=null;try{j=await r.json()}catch{}if(!r.ok)throw new Error((j&&j.error)||'خطا');return j}
let me=null,mode='login',msg='',TR=[];
const box=()=>{const m=msg;msg='';return m?`<div class="msg">${esc(m)}</div>`:''},V=id=>document.getElementById(id).value;
const A=h=>$('#app').innerHTML=h;
async function render(){
  try{me=await api('me')}catch{me=null}
  let h=(location.hash||'#board').slice(1);
  $('#nav').innerHTML=me?[['board','تابلوی سفرها'],['new','ثبت سفر'],['mine','سفرهای من'],...(me.role==='admin'?[['admin','مدیریت']]:[])].map(([k,l])=>`<a href="#${k}" class="${h===k?'on':''}">${l}</a>`).join('')+`<span class="tag w">🪙 ${fa(me.tokens)}</span><a href="#" data-act="logout">خروج</a>`:'';
  if(!me)return auth();
  try{await({board,new:newTrip,mine,admin}[h]||board)()}catch(e){A(`<div class="msg">${esc(e.message)}</div>`)}
}
function auth(){const r=mode==='register';A(`<h2>${r?'ثبت‌نام دانشجویی':'ورود'}</h2>${box()}<div class="card"><div class="row">
${r?'<div><label>نام</label><input id="name"></div>':''}<div><label>شماره دانشجویی</label><input id="sid" inputmode="numeric"></div>
<div><label>رمز عبور</label><input id="pass" type="password"></div>
${r?'<div><label>جنسیت</label><select id="gender"><option value="f">خانم</option><option value="m">آقا</option></select></div><div><label>شماره تماس یا آیدی تلگرام</label><input id="contact"></div>':''}</div>
<p><button data-act="auth">${r?'ثبت‌نام و دریافت ۱۰ توکن':'ورود'}</button> <button class="s" data-act="mode">${r?'حساب دارم':'ساخت حساب جدید'}</button></p></div>`)}
function list(){const f=V('ff').trim(),t=V('ft').trim();
  $('#list').innerHTML=TR.filter(x=>x.from_p.includes(f)&&x.to_p.includes(t)).map(x=>{const l=x.cap-x.cnt,bad=x.gender!=='all'&&x.gender!==me.gender;
  return `<div class="card trip"><div><b>${esc(x.from_p)} ← ${esc(x.to_p)}</b><div class="mut">${fd(x.depart_at)} · سازنده: ${esc(x.owner)}</div>
  <div style="margin-top:6px"><span class="tag ${l?'ok':'er'}">${l?fa(l)+' صندلی خالی':'تکمیل'}</span><span class="tag w">${GL[x.gender]}</span></div></div>
  <button data-act="join" data-id="${x.id}" ${x.joined||!l||bad?'disabled':''}>${x.joined?'عضو هستید':bad?'نامناسب برای شما':l?'همسفر می‌شوم (۱ توکن)':'تکمیل'}</button></div>`}).join('')
  ||'<div class="card mut">هنوز سفری ثبت نشده است. اولین سفر را شما ثبت کنید.</div>'}
async function board(){TR=await api('trips');A(`<h2>تابلوی سفرها</h2>${box()}<div class="card"><div class="row"><div><label>مبدا</label><input id="ff" placeholder="مثلاً درب دانشگاه"></div><div><label>مقصد</label><input id="ft"></div></div></div><div id="list"></div><p class="mut">شماره تماس همسفران فقط پس از پیوستن نمایش داده می‌شود.</p>`);list();$('#ff').oninput=$('#ft').oninput=list}
function newTrip(){A(`<h2>ثبت سفر جدید</h2>${box()}<div class="card"><div class="row">
<div><label>مبدا</label><input id="from" list="pl"></div><div><label>مقصد</label><input id="to" list="pl"></div>
<datalist id="pl"><option>درب دانشگاه<option>خوابگاه دختران<option>خوابگاه پسران</datalist>
<div><label>زمان حرکت</label><input id="when" type="datetime-local"></div>
<div><label>ظرفیت کل (با خودتان)</label><select id="cap"><option>2<option>3<option selected>4</select></div>
<div><label>فیلتر جنسیتی</label><select id="g"><option value="all">مختلط</option><option value="f">فقط خانم‌ها</option><option value="m">فقط آقایان</option></select></div></div>
<p><button data-act="create">ثبت سفر (۱ توکن)</button></p></div>`)}
async function mine(){const {trips,notes}=await api('mine'),now=Date.now();
  A(`<h2>سفرهای من</h2>${box()}${trips.map(t=>{const own=t.owner_id==me.id,past=new Date(t.depart_at.replace(' ','T'))<=now;
  return `<div class="card"><div class="trip"><div><b>${esc(t.from_p)} ← ${esc(t.to_p)}</b><div class="mut">${fd(t.depart_at)} · ${GL[t.gender]} · ${t.status==='done'?'پایان‌یافته':'فعال'}</div></div>
  <div>${t.status==='active'?`${own&&past?`<button data-act="done" data-id="${t.id}">پایان سفر</button> `:''}<button class="d" data-act="cancel" data-id="${t.id}">${own?'لغو سفر':'انصراف'}</button>`:''}</div></div>
  ${t.members.map(m=>`<div class="ct"><div class="trip"><span>${esc(m.name)}: ${esc(m.contact)}</span>${t.status==='done'?(m.rated?'<span class="tag">امتیاز ثبت شد</span>':`<span><select id="s${t.id}_${m.id}" style="width:auto"><option>5<option>4<option>3<option>2<option>1</select> <select id="g${t.id}_${m.id}" style="width:auto"><option value="good">خوش‌قول<option value="late">دیر آمد<option value="rude">بدرفتار<option value="noshow">نیامد</select> <button class="s" data-act="rate" data-t="${t.id}" data-u="${m.id}">ثبت</button></span>`):''}</div></div>`).join('')||'<div class="mut">هنوز همسفری نپیوسته است.</div>'}</div>`}).join('')||'<div class="card mut">سفری ندارید.</div>'}
  <h2>اعلان‌ها</h2>${notes.map(n=>`<div class="card" style="padding:8px 14px">${esc(n.text)} <span class="mut">${fd(n.created)}</span></div>`).join('')||'<div class="mut">اعلانی نیست.</div>'}`)}
async function admin(){const u=await api('admin_users');
  A(`<h2>مدیریت کاربران و امتیازها</h2>${box()}<div class="card sc"><table><tr><th>نام</th><th>شماره دانشجویی</th><th>تماس</th><th>میانگین</th><th>تعداد</th><th>گزارش منفی</th><th>توکن</th><th></th></tr>
  ${u.map(x=>`<tr><td>${esc(x.name)}${x.role==='admin'?' <span class="tag w">ادمین</span>':''}${x.blocked==1?' <span class="tag er">مسدود</span>':''}</td><td>${esc(x.sid)}</td><td>${esc(x.contact)}</td><td>${x.avg??'—'}</td><td>${fa(x.n)}</td><td>${fa(x.bad)}</td><td>${fa(x.tokens)}</td>
  <td><button class="s" data-act="det" data-id="${x.id}">جزئیات</button> <button class="s" data-act="tok" data-id="${x.id}">شارژ</button> ${x.role==='admin'?'':`<button class="${x.blocked==1?'s':'d'}" data-act="blk" data-id="${x.id}" data-b="${x.blocked==1?0:1}">${x.blocked==1?'رفع مسدودی':'مسدود'}</button>`}</td></tr>`).join('')}</table></div><div id="det"></div>`)}
const H={
 async auth(){const r=mode==='register';await api(mode,r?{name:V('name'),sid:V('sid'),pass:V('pass'),gender:V('gender'),contact:V('contact')}:{sid:V('sid'),pass:V('pass')});location.hash='#board'},
 mode(){mode=mode==='login'?'register':'login'},
 async logout(){await api('logout',{});location.hash='#'},
 async join(d){await api('join',{id:+d.id});location.hash='#mine'},
 async create(){await api('create',{from:V('from'),to:V('to'),when:V('when'),cap:+V('cap'),g:V('g')});location.hash='#mine'},
 async cancel(d){if(confirm('مطمئن هستید؟'))await api('cancel',{id:+d.id})},
 async done(d){await api('done',{id:+d.id})},
 async rate(d){await api('rate',{trip:+d.t,to:+d.u,stars:+V(`s${d.t}_${d.u}`),tag:V(`g${d.t}_${d.u}`)})},
 async blk(d){await api('admin_block',{uid:+d.id,blocked:+d.b==1})},
 async tok(d){const n=prompt('تعداد توکن (منفی برای کسر):','10');if(n)await api('admin_tokens',{uid:+d.id,amount:+n})},
 async det(d){const r=await api('admin_ratings&uid='+d.id);$('#det').innerHTML=`<div class="card">${r.map(x=>`<div>${'★'.repeat(x.stars)} ${x.tag?`<span class="tag ${x.tag==='good'?'ok':'er'}">${TG[x.tag]}</span>`:''}از ${esc(x.rater)} · ${esc(x.from_p)} ← ${esc(x.to_p)}</div>`).join('')||'<span class="mut">امتیازی ثبت نشده</span>'}</div>`;return 1}
};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();
  try{const k=await H[b.dataset.act](b.dataset);if(k!==1)await render()}catch(x){msg=x.message;await render()}});
addEventListener('hashchange',render);render();
</script></body></html>
